<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Industrial Part Counter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { 
            margin: 0; background: #111; color: #00e5ff; 
            font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; 
        }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* HUD Style */
        .hud-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 20, 30, 0.8);
            border-left: 4px solid #00e5ff;
            padding: 15px 25px; z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-label { font-size: 11px; letter-spacing: 2px; color: #aaa; margin-bottom: 2px; }
        .hud-value { font-size: 32px; font-weight: 900; font-family: monospace; }
        
        .system-status {
            position: absolute; bottom: 20px; right: 20px;
            font-size: 10px; color: #00e5ff; text-align: right;
        }

        #loader {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #111; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .loading-bar { width: 200px; height: 2px; background: #222; margin-top: 10px; position: relative; }
        .loading-progress { width: 0%; height: 100%; background: #00e5ff; transition: width 0.3s; }
    </style>
</head>
<body>

<div id="loader">
    <div style="margin-bottom:10px">SCANNER SYSTEM READYING...</div>
    <div class="loading-bar"><div id="progress" class="loading-progress"></div></div>
</div>

<div class="hud-panel">
    <div class="hud-label">TOTAL COMPONENTS</div>
    <div id="count-value" class="hud-value">000</div>
</div>

<div class="system-status">
    AI ENGINE: COCO-SSD LITE<br>
    MODE: SYMMETRY TRACKING ON
</div>

<div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('count-value');
    const progress = document.getElementById('progress');

    let model;

    async function init() {
        try {
            progress.style.width = "30%";
            model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            progress.style.width = "60%";
            
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                progress.style.width = "100%";
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
                detect();
            };
        } catch (err) {
            alert("Gagal mengakses kamera atau memuat model AI.");
        }
    }

    function drawPartCrosshair(x, y, size) {
        // Lingkaran luar putus-putus
        ctx.strokeStyle = '#00e5ff';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(x, y, size, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        // Titik pusat (Center Point)
        ctx.fillStyle = '#ff3d00'; // Warna merah kontras untuk titik pusat
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();

        // Label Koordinat
        ctx.fillStyle = '#00e5ff';
        ctx.font = "10px monospace";
        ctx.fillText(`X:${Math.round(x)} Y:${Math.round(y)}`, x + size + 5, y);
    }

    async function detect() {
        const predictions = await model.detect(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let componentsFound = 0;

        predictions.forEach(p => {
            const [x, y, width, height] = p.bbox;
            const ratio = width / height;
            const size = (width + height) / 2;

            // KRITERIA KHUSUS KOMPONEN (MUR/BAUT/TUTUP BOTOL)
            // 1. Rasio harus sangat dekat dengan lingkaran/persegi (0.8 - 1.25)
            // 2. Kita menghitung objek kecil (size > 20 pixel) agar noise tidak terhitung
            const isComponentShape = ratio > 0.8 && ratio < 1.25;
            
            if (isComponentShape && size > 20) {
                componentsFound++;
                
                const centerX = x + (width / 2);
                const centerY = y + (height / 2);
                const radius = Math.max(width, height) / 2 + 10;

                drawPartCrosshair(centerX, centerY, radius);
            }
        });

        countDisplay.innerText = componentsFound.toString().padStart(3, '0');
        requestAnimationFrame(detect);
    }

    init();
</script>
</body>
</html>
