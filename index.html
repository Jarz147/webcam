<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Tracking Crosshair</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: sans-serif; overflow: hidden; }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .ui-layer { position: absolute; bottom: 20px; width: 100%; text-align: center; z-index: 10; }
        .target-info { background: rgba(255, 0, 0, 0.6); padding: 10px 20px; border-radius: 5px; display: none; }
    </style>
</head>
<body>

<div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
</div>

<div class="ui-layer">
    <div id="target-ui" class="target-info">TARGET LOCKED</div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const targetUI = document.getElementById('target-ui');

    let model;

    async function init() {
        model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
        });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            detect();
        };
    }

    function drawCrosshair(x, y, size) {
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 2;
        
        // Garis Horizontal
        ctx.beginPath();
        ctx.moveTo(x - size, y);
        ctx.lineTo(x + size, y);
        ctx.stroke();

        // Garis Vertikal
        ctx.beginPath();
        ctx.moveTo(x, y - size);
        ctx.lineTo(x, y + size);
        ctx.stroke();

        // Lingkaran Tengah
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.stroke();
    }

    async function detect() {
        const predictions = await model.detect(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let targetFound = false;

        predictions.forEach(p => {
            const [x, y, width, height] = p.bbox;
            const centerX = x + (width / 2);
            const centerY = y + (height / 2);
            const ratio = width / height;

            // Logika Deteksi Bentuk:
            // 1. Cek rasio aspek (untuk Persegi/Lingkaran biasanya 0.8 - 1.2)
            // 2. Filter kategori tertentu yang berbentuk bulat/kotak
            const isSymmetrical = ratio > 0.8 && ratio < 1.2;
            const targetClasses = ['sports ball', 'apple', 'orange', 'clock', 'bowl', 'cell phone', 'book'];

            if (isSymmetrical || targetClasses.includes(p.class)) {
                targetFound = true;
                
                // Munculkan Crosshair di tengah objek
                drawCrosshair(centerX, centerY, 40);

                // Gambar Box Tipis sebagai feedback
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(x, y, width, height);
                ctx.setLineDash([]);
                
                // Label Target
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 16px monospace';
                ctx.fillText(`TRK_${p.class.toUpperCase()}`, x, y - 10);
            }
        });

        targetUI.style.display = targetFound ? 'inline-block' : 'none';
        requestAnimationFrame(detect);
    }

    init();
</script>
</body>
</html>
