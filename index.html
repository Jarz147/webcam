<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal Object Counter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: sans-serif; overflow: hidden; 
        }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* HUD - Pojok Layar */
        .hud-counter {
            position: absolute; top: env(safe-area-inset-top, 20px); left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-left: 5px solid #ff3d00;
            padding: 15px 25px; z-index: 100;
            border-radius: 0 10px 10px 0;
        }
        .hud-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #ccc; }
        .hud-value { font-size: 40px; font-weight: bold; font-family: monospace; }

        /* Loader */
        #loader {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid #333;
            border-top: 3px solid #ff3d00; border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p style="margin-top:15px; font-size: 12px; letter-spacing: 2px;">LOADING AI ENGINE...</p>
</div>

<div class="hud-counter">
    <div class="hud-label">Object Count</div>
    <div id="count-value" class="hud-value">0</div>
</div>

<div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('count-value');
    const loader = document.getElementById('loader');

    let model;

    async function init() {
        try {
            // Memuat model Lite agar lancar di HP
            model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: 'environment', 
                    width: { ideal: 1280 }, 
                    height: { ideal: 720 } 
                }
            });
            
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                loader.style.display = 'none';
                detect();
            };
        } catch (err) {
            alert("Sistem membutuhkan izin kamera.");
        }
    }

    function drawTarget(x, y, size) {
        // Lingkaran Crosshair
        ctx.strokeStyle = '#ff3d00';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, size * 0.8, 0, Math.PI * 2);
        ctx.stroke();

        // Titik Tengah
        ctx.fillStyle = '#ff3d00';
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    async function detect() {
        // Ambil semua prediksi objek
        const predictions = await model.detect(video);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let count = 0;

        predictions.forEach(p => {
            const [x, y, width, height] = p.bbox;
            const ratio = width / height;

            // Filter Simetri: Mengunci objek yang bentuknya mendekati bulat/kotak
            // Berguna untuk mur, baut, dan tutup botol
            if (ratio > 0.7 && ratio < 1.3) {
                count++;
                
                const centerX = x + (width / 2);
                const centerY = y + (height / 2);
                const targetSize = (width + height) / 4;

                drawTarget(centerX, centerY, targetSize);
            }
        });

        // Update nilai di pojok layar
        countDisplay.innerText = count;

        requestAnimationFrame(detect);
    }

    init();
</script>
</body>
</html>
