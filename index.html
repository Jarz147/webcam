<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Industrial Counter</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <style>
        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: 'Arial', sans-serif; overflow: hidden; 
        }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* HUD Style mirip gambar contoh */
        .hud-bottom {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px 20px; text-align: center;
            border-top: 1px solid #444; z-index: 100;
        }
        .counting-text { font-size: 14px; color: #aaa; letter-spacing: 2px; margin-bottom: 5px; }
        .total-number { font-size: 60px; font-weight: bold; line-height: 1; }
        
        #loader {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
    </style>
</head>
<body>

<div id="loader">
    <div style="border:3px solid #333; border-top:3px solid #007bff; width:30px; height:30px; border-radius:50%; animation: spin 1s linear infinite;"></div>
    <p style="margin-top:15px">BOOTING SYSTEM...</p>
</div>

<div id="video-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
</div>

<div class="hud-bottom">
    <div class="counting-text">COUNTING...</div>
    <div id="count-value" class="total-number">0</div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('count-value');

    let model;

    async function init() {
        try {
            model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: {ideal: 1280}, height: {ideal: 720} }
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                document.getElementById('loader').style.display = 'none';
                detect();
            };
        } catch (err) { alert("Izin kamera diperlukan."); }
    }

    function drawNumberedMarker(x, y, id) {
        // 1. Gambar Lingkaran Putih (Background angka)
        ctx.fillStyle = 'rgba(0, 123, 255, 0.9)'; // Warna biru seperti di gambar
        ctx.beginPath();
        ctx.arc(x, y, 15, 0, Math.PI * 2);
        ctx.fill();
        
        // 2. Gambar Outline Putih
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 3. Gambar Nomor Urut
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(id, x, y);
    }

    async function detect() {
        const predictions = await model.detect(video);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        let validCount = 0;

        predictions.forEach((p, index) => {
            const [x, y, width, height] = p.bbox;
            const ratio = width / height;

            // Filter benda yang bentuknya proporsional (mur, baut, tutup botol)
            if (ratio > 0.6 && ratio < 1.4) {
                validCount++;
                
                const centerX = x + (width / 2);
                const centerY = y + (height / 2);

                // Gambar penomoran otomatis
                drawNumberedMarker(centerX, centerY, validCount);
            }
        });

        countDisplay.innerText = validCount;
        requestAnimationFrame(detect);
    }

    init();
</script>

<style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</body>
</html>
